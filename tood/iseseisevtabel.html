<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iseseisevtabel</title>
  <link rel="stylesheet" href="iseseisevtabelStyle.css">
</head>
<body>

<table>
  <tr>
    <td class="a">A</td>
    <td class="b">B</td>
    <td class="c">C</td>
    <td colspan="2" class="d">D</td>
  </tr>

  <tr>
    <td colspan="2" class="e">E</td>
    <td rowspan="3" class="odin">1</td>
    <td class="f">F</td>
    <td class="g">G</td>
  </tr>

  <tr>
    <td class="plus">+</td>
    <td class="plus">+</td>
    <td colspan="2" class="pusto"></td>
  </tr>

  <tr>
    <td class="plus">+</td>
    <td class="plus">+</td>
    <td rowspan="2" class="dva">2</td>
    <td rowspan="2" class="dva">2</td>
  </tr>

  <tr>
    <td colspan="3" class="tri">3</td>
  </tr>
</table>

</body>
</html>
