<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>

    <link rel="stylesheet" href="tabelStyle.css">
    <link rel="stylesheet" href="lippudStyle.css">
</head>

<body>

<div id="tabelidBlock">

    <h1>Tabelid</h1>

    <h2>Lihtne Tabel</h2>
    <table id="lihtne1">
        <tr>
            <td>A</td>
            <td>B</td>
        </tr>
        <tr>
            <td>C</td>
            <td>D</td>
        </tr>
    </table>

    <h2>Lihte Tabel Kus on ühendatud lahtrid</h2>
    <table id="keeruline1">
        <tr>
            <td colspan="2" class="nimia">A</td>
        </tr>
        <tr>
            <td>C</td>
            <td>D</td>
        </tr>
    </table>

    <h2>Veel üks tabel ku on ühendatud lahtrid</h2>
    <table id="keeruline2">
        <tr>
            <td rowspan="2" class="nimia">A</td>
            <td>B</td>
        </tr>
        <tr>
            <td>D</td>
        </tr>
    </table>

</div>
