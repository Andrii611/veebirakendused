<p>Vajuta monitorile, arvutile, klaviatuurile, kellele, hiirele või ps5.</p>

<img src="Pildid/Toolaud.jpg" alt="Arvuti pilt" usemap="#arvuti">

<map name="arvuti">

    <area shape="rect"
          coords="190,555,470,675"

    <area shape="rect"
          coords="520,535,710,745"

          alt="Arvuti">
    <area shape="rect"
          coords="205,775,410,885"
          href="klaviatuur.html"
          alt="Klaviatuur">

    <area shape="circle"
          coords="488,777,30"
          href="hiir.html"
          alt="Hiir">

    <area shape="poly"
          coords="0,635,75,850,0,880"
          href="ps5.html"
          alt="PS5">

    <area shape="rect"
          coords="550,475,650,515"
          href="kell.html"
