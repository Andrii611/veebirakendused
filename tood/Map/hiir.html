<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Hiir</title>
    <link rel="stylesheet" href="mapStyle.css">
</head>

<body>

<h1>Map area kasutamine</h1>

<p>Vajuta monitorile, arvutile, klaviatuurile, kellele, hiirele või ps5.</p>

<img class="arvutipilt"
     src="Pildid/Toolaud.jpg"
     alt="Arvuti pilt"
     usemap="#arvuti">

<h2>Hiir</h2>

<p>
    Hiir on arvuti sisendseade.
    Hiire abil saab liigutada kursorit ja valida erinevaid asju ekraanil.
    Hiirel on tavaliselt vasak nupp, parem nupp ja kerimisrull.
</p>

<img class="illustratsioon"
     src="Pildid/hiir.jpg"
     alt="Hiir">

<map name="arvuti">

    <area shape="rect"
          coords="190,510,470,745"
          href="monitor.html"
          alt="Monitor">

    <area shape="rect"
          coords="515,520,710,745"
          href="arvuti.html"
          alt="Arvuti">

    <area shape="rect"
          coords="205,775,410,885"
          href="klaviatuur.html"
          alt="Klaviatuur">

    <area shape="circle"
          coords="488,777,30"
          href="hiir.html"
          alt="Hiir">

    <area shape="rect"
          coords="0,635,75,880"
          href="ps5.html"
          alt="PS5">

    <area shape="rect"
          coords="550,480,650,525"
          href="kell.html"
          alt="Kell">

</map>


</body>
</html>
