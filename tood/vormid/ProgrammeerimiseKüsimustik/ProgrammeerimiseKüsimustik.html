<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Programmeerimise küsimustik</title>
  <link rel="stylesheet" href="kysimustikStyle.css">
  <script src="ProgrammeerimiseScript.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"></script>
  <script>  $(function(){
    // peidame vead
    $('.viga').hide();

    // puhastusnupp
    $('#puhasta').click(function(){
      $('#muusikaVorm')[0].reset();
      $('.viga').hide();
    });

    // valideerimine, kui vorm on saadetud
    $('#muusikaVorm').submit(function(event){
      let valid = true;

      // 1. Checkbox
      if($('input[name="valik"]:checked').length === 0){
        $('#viga1').show();
        valid = false;
      } else { $('#viga1').hide(); }

      // 2. Textarea
      if($('#musik').val().trim() === ""){
        $('#viga2').show();
        valid = false;
      } else { $('#viga2').hide(); }

      // 3. Number (0–24)
      let tunnid = $('#musiktund').val();
      if(tunnid === "" || isNaN(tunnid) || tunnid < 0 || tunnid > 24){
        $('#viga3').show();
        valid = false;
      } else { $('#viga3').hide(); }

      // 4. Radio
      if($('input[name="raadio"]:checked').length === 0){
        $('#viga4').show();
        valid = false;
      } else { $('#viga4').hide(); }

      // 5. Text (ainult tähed)
      let tekst = $('#kysi5').val().trim();
      if(tekst === "" || !/^[a-zA-Z\s]+$/.test(tekst)){
        $('#viga5').show();
        valid = false;
      } else { $('#viga5').hide(); }

      // 6. Select
      if($('#muusikaliik').val() === ""){
        $('#viga6').show();
        valid = false;
      } else { $('#viga6').hide(); }

      // kui on vead, siis ei ole vaja vormi saada
      if(!valid){
        event.preventDefault();
      } else {
        alert("Vorm on edukalt saadetud!");
      }
    });
  });
  </script>
</head>
<body>
<h1>Programmeerimise küsimustik</h1>
<table>
  <tr>
    <td>
      <fieldset>
        <legend>Tee oma valik - lemmik programmeerimiskeel</legend>

        <input type="checkbox" name="lemmik" id="PHP" value="PHP" onclick="programmeerimiskeeliCheckbox()">
        <label for="PHP">PHP</label>
        <br>

        <input type="checkbox" name="lemmik" id="Java" value="Java" onclick="programmeerimiskeeliCheckbox()">
        <label for="Java">Java</label>
        <br>

        <input type="checkbox" name="lemmik" id="JavaScript" value="JavaScript" onclick="programmeerimiskeeliCheckbox()">
        <label for="JavaScript">JavaScript</label>
        <br>

        <input type="checkbox" name="lemmik" id="Python" value="Python" onclick="programmeerimiskeeliCheckbox()">
        <label for="Python">Python</label>
        <br>

      </fieldset>
    </td>
    <td>
      <div id="vastus1"></div>
    </td>
  </tr>
  <tr>
    <td>
      <label for="arvamus">Mida arvad programmeerimise õppimisest?</label>
    </td>
    <td>
      <input type="text" name="arvamus" id="arvamus" placeholder="" oninput="programmeerimiseOppimisest()"/>
    </td>
    <td>
      <div id="vastus2"></div>
    </td>
  </tr>
  <tr>
    <td>
      <label for="tund">
        Mitu tundi nädalas tegeled programmeerimisega?
      </label>
    </td>
    <td>
      0<input type="range" id="tund" min="0" max="50" onchange="rangeValik()">50
    </td>
    <td>
      <div id="vastus3"></div>
    </td>
  </tr>
  <tr>
    <td>
      <label>Kas sulle meeldib programmeerida?</label>
    </td>
    <td>
      <input type="radio" name="programmeeridaValik" id="jah" value="jah" onclick="programmeeridaValik()">
      <label for="jah">Jah</label>

      <input type="radio" name="programmeeridaValik" id="ei" value="ei" onclick="programmeeridaValik()">
      <label for="ei">Ei</label>
    </td>
    <td>
      <div id="vastus4"></div>
      <img src="" alt="" id="pilt">
    </td>
  </tr>
  <tr>
    <td>
      <input type="reset" value="Puhasta" onclick="Puhasta()">
    </td>
  </tr>
  <tr>
    <td>
      <label for="tooriistad">
        Milliseid programmeerimisega seotud tööriistu oskad nimetada?
      </label>
    </td>
    <td>
      <input type="text" id="tooriistad" oninput="tooriistadValik()">
    </td>
    <td>
      <div id="vastus5"></div>
    </td>
  </tr>

  <tr>
    <td>
      <label for="keel">Millist programmeerimiskeelt sooviksid kõige rohkem õppida?</label>
    </td>
    <td>
      <select id="keel" onchange="keelValik()">
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="Java">Java</option>
        <option value="C#">C#</option>
        <option value="PHP">PHP</option>
        <option value="C++">C++</option>
      </select>
    </td>
    <td>
      <div id="vastus6"></div>
    </td>
  </tr>

  <tr>
    <td>
      <input type="button" value="Saada" onclick="Saada()">
      <input type="reset" value="Puhasta" onclick="Puhasta()">
    </td>
  </tr>
  <tr>
    <td colspan="3">
      <h3>Kokkuvõte</h3>
      <div id="kokkuvote"></div>
    </td>
  </tr>
</table>


</body>
</html>
