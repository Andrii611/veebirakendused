<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="vormStyle.css">
    <script src="../JavaScript/kysimustikScript.js"></script>
</head>
<body>
<h1>Muusika küsimustik</h1>
<h2>HTML vormid ja nupud</h2>
<form action="#">
    <!-- c + tab komentaar -->
    <table style="border: 1px solid black;">
        <tr>

            <td>
                <!-- Tekstcast -->
                <label for="nimi">Nimi:</label>
            </td>   <!-- Tekstcast -->
            <td>
                <input type="text" id="nimi" placeholder="Andrii" oninput="nimiLugemineKastis()">
            </td>
            <td>
                <div id="vastus1"></div>
            </td>
            </tr>
        <tr>
            <td>
                <label for="stiil">Vali meeldivaim muusikakastiil</label>
            </td>
            <td>
                <select name="stiil" id="stiil" onchange="selectValik()">
                    <option value="vali">vali...</option>
                    <option value="Hiphop">Hiphop</option>
                    <option value="kantri">kantri</option>
                    <option value="rock">rock</option>
                    <option value="funk">funk</option>
                    <option value="metal">metal</option>
                </select>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>

        </tr>
        <tr>
            <!-- radionupp -->
            <td>
                <br>
                <input type="radio" name="platvorm" id="spotify" value="spotify" onclick="radioValik()">
                <label for="spotify">Spotify</label>
                <br>
                <input type="radio" name="platvorm" id="raadio" value="raadio" onclick="radioValik()">
                <label for="raadio">raadio</label>
                <br>
                <input type="radio" name="platvorm" id="vinüülplaat" value="vinüülplaat" onclick="radioValik()">
                <label for="vinüülplaat">vinüülplaat</label>
            </td>
            <td>
                <div id="vastus2"></div>
            </td>

            <!-- checkbox -->
            <tr>
               <td colspan="2">
                <fieldset>
                    <legend>Tee oma valik - lemmik ansambel</legend>

                    <input type="checkbox" name="lemmik" id="Radiohead" value="Radiohead" onclick="checkboxValik()">
                    <label for="Radiohead">Radiohead</label>
                    <br>

                    <input type="checkbox" name="lemmik" id="rollingstones" value="rollingstones" onclick="checkboxValik()">
                    <label for="rollingstones">Rolling Stones</label>
                    <br>

                    <input type="checkbox" name="lemmik" id="thesmiths" value="thesmiths" onclick="checkboxValik()">
                    <label for="thesmiths">The Smiths</label>
                    <br>

                    <input type="radio" name="lemmik" id="thesmashingpumpkins" value="thesmashingpumpkins" onclick="checkboxValik()">
                    <label for="thesmashingpumpkins">The Smashing Pumpkins</label>
                    <br>

                </fieldset>
               </td>
                 <td>
                     <div id="vastus3"></div>
                 </td>
            </tr>
        </tr>
        <tr>
            <!-- range - vahemik-->
            <td>
                <label for="tund">
                    Mitu tundi päevas sa kuulad muusikat
                </label>
            </td>

            <td>0<input type="range" id="tund" min="0" max="24" onchange="rangeValik()">24</td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
        <tr>
            <td>
                  Email
            </td>

        </tr>

        <tr>
            <td>
                <input type="Button" value="Puhasta" onclick="puhasta()">
            </td>
            <td>
                <input type="Button" value="Naita" onclick="naitaKoike()">
            </td>
        </tr>
    </table>
    <br>
</form>
</body>
</html>
